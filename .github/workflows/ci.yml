name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-apworld:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out Jak3-AP
        uses: actions/checkout@v7

      - name: Check out compatible Archipelago core
        uses: actions/checkout@v7
        with:
          repository: ArchipelagoMW/Archipelago
          ref: feab54daec712ffb333b8c73f38eb69e1ed9c508
          path: archipelago

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install check dependencies
        shell: pwsh
        run: >-
          python -m pip install
          pytest==8.4.1 ruff==0.12.11 mypy==1.17.1
          colorama websockets==13.1 PyYAML==6.0.3 jellyfish==1.2.1
          jinja2==3.1.6 schema==0.7.8 bsdiff4==1.2.6
          platformdirs==4.9.4 certifi typing_extensions orjson pathspec

      - name: Lint, format, and type checks
        shell: pwsh
        run: .\tools\run_ci_checks.ps1 -Phase Static

      - name: Build APWorld package
        shell: pwsh
        run: .\tools\run_ci_checks.ps1 -Phase Package

      - name: Run unit, import, registry, YAML, and generation checks
        shell: pwsh
        run: .\tools\run_ci_checks.ps1 -Phase Tests -ArchipelagoPath .\archipelago
