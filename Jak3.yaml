# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. The options in this file are weighted. The higher number assigned to a value, the more likely it is
#    to be chosen. A single plain value is also accepted when you do not want random selection.
#
# Q. How can I validate it?
# A. This is a YAML file. You can check YAML syntax at http://www.yamllint.com/ and validate installed
#    Archipelago options at https://archipelago.gg/check.

# Your in-game slot name, limited to 16 characters.
# {player}/{PLAYER} use the slot number; {number}/{NUMBER} use a duplicate-name counter.
name: Player{number}

# Useful when keeping several option files.
description: Default Jak 3 Template

game: Jak 3
requires:
  version: 0.6.7 # Minimum Archipelago version expected by this world.
  game:
    Jak 3: 0.1.0 # Minimum Jak 3 APWorld version expected by this template.

Jak 3:
  ################
  # Game Options #
  ################
  progression_balancing:
    # Allows Archipelago to move progression earlier to reduce long dry periods.
    # Minimum value is 0; maximum value is 99.
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-99: 0
    disabled: 0 # equivalent to 0
    normal: 50 # equivalent to 50
    extreme: 0 # equivalent to 99

  accessibility:
    # Full ensures every location is reachable. Minimal ensures only the selected goal is reachable.
    full: 50
    minimal: 0

  ###################
  # Completion Goal #
  ###################
  jak_3_completion_condition:
    # Complete a selected story mission, or complete the configured number of story missions.
    complete_specific_mission: 0
    complete_number_of_missions: 50

  specific_mission_for_completion:
    # Used only when the completion condition is Complete Specific Mission.
    defeat_precursor_robot: 0
    defeat_war_factory_boss: 0
    defend_spargus: 0
    destroy_dark_maker_tower: 0
    destroy_dark_ship: 0
    defeat_cyber_errol: 50

  number_of_missions_for_completion:
    # Used only when the completion condition is Complete Number of Missions. Only the 66 story tasks count;
    # optional challenges do not. Mission logic includes its required weapon tiers, vehicles, and powers.
    # Minimum value is 5; maximum value is 66.
    66: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-5-66: 0

  #########
  # Traps #
  #########
  percent_filler_replaced_with_traps:
    # Percentage of consumable filler (health, ammo, and eco) replaced by traps. Progression is unaffected.
    # Minimum value is 0; maximum value is 100.
    0: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-100: 0

  trap_effect_duration:
    # Duration in seconds for timed trap effects. Minimum value is 5; maximum value is 60.
    30: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-5-60: 0

  trap_weights:
    # Relative trap selection weights. A weight of 0 disables that trap; all zero disables trap placement.
    Ammo Trap: 1
    Camera Trap: 1
    Dark Trap: 1
    Darkness Trap: 1
    Earthquake Trap: 1
    Gravity Trap: 1
    Health Trap: 1
    Hero Trap: 1
    High Alert Trap: 1
    Ledge Trap: 1
    Mirror Trap: 1
    Pacifism Trap: 1
    Slip Trap: 1
    Slow Trap: 1
    Speed Trap: 1
    Teleport Trap: 1
    Trip Trap: 1

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
    # Forces these items to remain in this Jak 3 world.
    []

  non_local_items:
    # Forces these items to be placed in other players' worlds.
    []

  start_inventory:
    # Begin with items without removing their normal pool copies. Example: {Jetboard: 1}
    {}

  start_inventory_from_pool:
    # Begin with items removed from this world's pool. Example: {Progressive Scatter Gun: 1}
    {}

  start_hints:
    # Start with these items prefilled into the !hint command.
    []

  start_location_hints:
    # Start with these locations prefilled into the !hint command.
    []

  exclude_locations:
    # Prevent these locations from containing important items.
    []

  priority_locations:
    # Prevent these locations from containing unimportant items.
    []

  item_links:
    # Share part of this item pool with other players.
    []

  plando_items:
    # Generic item placement planning.
    []
